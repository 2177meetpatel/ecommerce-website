<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet"
    href="./assets/css/main.css">

</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            ShopEase
        </div>

    </header>

    <!-- LOGIN SECTION -->

    <section class="auth-section">

        <div class="auth-container">

            <h1>Login</h1>

            <!-- FORM -->

            <form id="login-form">

                <!-- EMAIL -->

                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        id="login-email"
                        placeholder="Enter email"
                    >

                    <small class="error">
                    </small>

                </div>

                <!-- PASSWORD -->

                <div class="form-group">

                    <label>Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="login-password"
                            placeholder="Enter password"
                        >

                        <button
                            type="button"
                            class="toggle-password"
                        >
                            👁
                        </button>

                    </div>

                    <small class="error">
                    </small>

                </div>

                <!-- FORGOT PASSWORD -->

                <a href="#" class="forgot-link">

                    Forgot Password?

                </a>

                <!-- BUTTON -->

                <button
                    type="submit"
                    class="hero-btn auth-btn"
                >
                    Login
                </button>

            </form>

            <!-- SWITCH -->

            <p class="switch-text">

                Don't have an account?

                <a href="signup.html">
                    Sign Up
                </a>

            </p>

        </div>

    </section>

    <script src="./assets/js/auth.js"></script>

</body>
</html>
