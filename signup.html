<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Signup</title>

    <link rel="stylesheet"
    href="./assets/css/main.css">

</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            ShopEase
        </div>

    </header>

    <!-- SIGNUP SECTION -->

    <section class="auth-section">

        <div class="auth-container">

            <h1>Sign Up</h1>

            <!-- FORM -->

            <form id="signup-form">

                <!-- NAME -->

                <div class="form-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        id="signup-name"
                        placeholder="Enter full name"
                    >

                    <small class="error">
                    </small>

                </div>

                <!-- EMAIL -->

                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        id="signup-email"
                        placeholder="Enter email"
                    >

                    <small class="error">
                    </small>

                </div>

                <!-- PASSWORD -->

                <div class="form-group">

                    <label>Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="signup-password"
                            placeholder="Enter password"
                        >

                        <button
                            type="button"
                            class="toggle-password"
                        >
                            👁
                        </button>

                    </div>

                    <!-- STRENGTH -->

                    <div id="password-strength">

                    </div>

                    <small class="error">
                    </small>

                </div>

                <!-- CONFIRM -->

                <div class="form-group">

                    <label>Confirm Password</label>

                    <input
                        type="password"
                        id="confirm-password"
                        placeholder="Confirm password"
                    >

                    <small class="error">
                    </small>

                </div>

                <!-- BUTTON -->

                <button
                    type="submit"
                    class="hero-btn auth-btn"
                >
                    Sign Up
                </button>

            </form>

            <!-- SWITCH -->

            <p class="switch-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </section>

    <script src="./assets/js/auth.js"></script>

</body>
</html>
